<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Venturam - Medley's Nest Project Details">
    <title>Medley's Nest - Venturam</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/project-details.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <!-- Left navigation -->
            <ul class="navbar-nav navbar-left">
                <li><a href="#about" class="nav-link">ABOUT US</a></li>
                <li><a href="#medleys" class="nav-link">MEDLEYS</a></li>
                <li><a href="#projects" class="nav-link">PROJECTS</a></li>
            </ul>
            
            <!-- Center logo -->
            <a href="index.html" class="navbar-logo">
                <img src="assets/logo.png" alt="Venturam" class="logo-image">
            </a>
            
            <!-- Right navigation -->
            <ul class="navbar-nav navbar-right">
                <li><a href="#career" class="nav-link">CAREER</a></li>
                <li><a href="#testimonials" class="nav-link">TESTIMONIALS</a></li>
                <li><a href="#contact" class="nav-link">CONTACT US</a></li>
            </ul>
        </div>
    </nav>

    <!-- Section 1: Project Detail Intro -->
    <section class="project-intro">
        <div class="project-intro-bg"></div>
        <div class="project-intro-overlay"></div>
        
        <div class="project-intro-content">
            <h1 class="project-title">MEDLEY'S<br>NEST</h1>
            
            <div class="walkthrough-btn">
                <div class="walkthrough-circle">
                    <svg class="play-icon" width="20" height="24" viewBox="0 0 20 24" fill="none">
                        <path d="M0 0L20 12L0 24V0Z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="walkthrough-text">WALKTHROUGH<br>PLAY NOW</div>
            </div>
        </div>

        <div class="project-intro-bottom">
            <div class="project-location">
                <svg class="location-icon" width="24" height="32" viewBox="0 0 24 32" fill="none">
                    <path d="M12 0C5.37 0 0 5.37 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.37 18.63 0 12 0ZM12 16C9.79 16 8 14.21 8 12C8 9.79 9.79 8 12 8C14.21 8 16 9.79 16 12C16 14.21 14.21 16 12 16Z" fill="currentColor"/>
                </svg>
                <span class="location-text">PALLAVARAM</span>
            </div>

            <div class="project-stats">
                <div class="stat-item">
                    <div class="stat-value" data-target="1.22">0</div>
                    <div class="stat-label">ACRES OF<br>LAND</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" data-target="141">0</div>
                    <div class="stat-label">EXCLUSIVE<br>APARTMENTS</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value stat-value-text">2 & 3</div>
                    <div class="stat-label">BHK<br>HOMES</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value stat-value-text">4+</div>
                    <div class="stat-label">SIGNATURE<br>FLOORS</div>
                </div>
            </div>
        </div>
    </section>

    <!-- JavaScript -->
    <script src="js/project-details.js"></script>
</body>
</html>
